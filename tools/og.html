<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../public/fonts/archivo-latin-900-normal.woff2)}
@font-face{font-family:I;src:url(../public/fonts/instrument-sans-latin-600-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0F6870;position:relative;font-family:I}
.bg{position:absolute;inset:0;background:url(../public/img/svg/pattern-liquido-tono.svg) center/cover;opacity:.9}
.vig{position:absolute;inset:0;background:radial-gradient(90% 90% at 70% 40%,transparent 40%,rgb(6 40 44 / .55))}
.giant{position:absolute;left:0;right:0;text-align:center;top:46px;font:900 214px/.8 A;letter-spacing:-.045em;color:#F4EFE8;text-transform:uppercase;text-shadow:0 8px 0 #0A4A50,0 16px 0 #08393E;white-space:nowrap}
.giant span{color:transparent;-webkit-text-stroke:5px #F4EFE8;text-shadow:none}
.fab{position:absolute;right:30px;bottom:0;height:560px;filter:drop-shadow(0 20px 30px rgb(0 0 0 / .4))}
.band{position:absolute;left:0;right:0;bottom:-2px;height:70px;background:url(../public/img/svg/onde-bande-striscia.svg) center/cover}
.copy{position:absolute;left:56px;top:300px;color:#F4EFE8}
.k{display:flex;align-items:center;gap:12px;font:600 20px I;letter-spacing:.14em;text-transform:uppercase}
.k:before{content:"";width:34px;height:3px;background:#B8935A}
h1{font:900 76px/.92 A;text-transform:uppercase;letter-spacing:-.03em;margin-top:14px}
h1 em{font-style:normal;color:#0F6870;background:#F4EFE8;padding:0 .12em;border-radius:.1em}
.addr{margin-top:22px;font:600 22px I;color:#DDEAE7}
.stamp{position:absolute;left:470px;top:330px;width:120px;height:120px;border-radius:50%;background:#F4EFE8;display:grid;place-items:center;box-shadow:0 14px 30px -12px rgb(0 0 0 / .5)}
.stamp img{width:58%}
</style></head><body>
<div class="bg"></div><div class="vig"></div>
<div class="giant">Glam<span>oo</span>d</div>
<img class="fab" src="../public/img/hero/fabio-foto-960.webp">
<div class="copy"><div class="k">Barber shop · Reggio Calabria</div><h1>Ti prendo<br><em>le misure.</em></h1><div class="addr">Via Sbarre Centrali 282/G</div></div>
<div class="band"></div>
</body></html>
