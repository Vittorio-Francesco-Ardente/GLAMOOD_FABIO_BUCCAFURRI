name: Deploy su GitHub Pages
on:
  push:
    branches: [main, claude/serene-mccarthy-c1y4io]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

# Keep the current deployment alive when another push arrives.
# GitHub Pages can only publish one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://vittorio-francesco-ardente.github.io
      BASE: /GLAMOOD_FABIO_BUCCAFURRI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/img
          key: img-${{ hashFiles('assets/web/**', 'tools/assets.mjs') }}
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        # deploy-pages caps this value at 600000 ms; larger values are ignored.
        with: { timeout: 600000 }
