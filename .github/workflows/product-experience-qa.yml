name: Product experience QA
on:
  push:
    branches: [fix/product-experience-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: https://vittorio-francesco-ardente.github.io
      BASE: /GLAMOOD_FABIO_BUCCAFURRI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/cache/restore@v4
        id: images
        with:
          path: public/img
          key: img-${{ hashFiles('assets/web/**', 'tools/assets.mjs') }}
          restore-keys: img-
      - run: npm ci
      - run: npm run build
        id: build
      - uses: actions/cache/save@v4
        if: steps.build.outcome == 'success' && steps.images.outputs.cache-hit != 'true'
        with:
          path: public/img
          key: img-${{ hashFiles('assets/web/**', 'tools/assets.mjs') }}
      - run: npm install -g playwright@1.56.1
      - name: Check product pages and navigation
        run: node tools/product-smoke.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-experience-review
          path: qa/product-experience/
