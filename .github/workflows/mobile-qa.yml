name: Mobile layout QA (no deployment)
on:
  push:
    branches: [fix/mobile-polish-20261110, fix/fast-loader-no-sheen-20261110, fix/mobile-navbar-stable-leaves-hidden-20261110, fix/vhs-tap-stability-20261110, fix/mobile-navbar-compact-on-scroll-20261110, fix/mobile-menu-desktop-style-20261110, fix/mobile-product-accordion-footer-mascot-20261110, fix/book-loader-mascot-vhs-20261111, fix/vhs-center-ardake-loader-20261111, fix/header-titles-true-center-20261111, fix/mobile-header-vhs-scroll-20261111, fix/hero-cloud-elbow-silhouette-20261111, fix/mobile-price-layout-and-nav-polish-20261111, fix/mobile-home-game-cut-images-20261111, fix/mobile-home-integrated-salone-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE: https://vittorio-francesco-ardente.github.io
      BASE: /GLAMOOD_FABIO_BUCCAFURRI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - id: asset-cache
        uses: actions/cache@v4
        with:
          path: public/img
          key: img-${{ hashFiles('assets/web/**', 'tools/assets.mjs') }}
      - name: Build Astro for GitHub Pages
        run: npm run build
        env:
          ASSET_CACHE_HIT: ${{ steps.asset-cache.outputs.cache-hit }}
      - name: Use runner Chrome for browser checks
        run: |
          npm install -g playwright@1.56.1
          command -v google-chrome
      - name: Verify phone behavior and desktop isolation
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/mobile-smoke.mjs
